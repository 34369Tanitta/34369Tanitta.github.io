<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanitta | ติดต่อ</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(174, 228, 244, 0.55),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(240, 207, 103, 0.35),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff,
                    #fffdf2
                );

            color: #40536b;
            line-height: 1.7;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 8%;

            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid #b9e7f5;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #55aeca;
        }

        nav a {
            color: #5fa8c0;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #d3a62a;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 80px 20px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .section-number {
            color: #55aeca;
            font-family: monospace;
            font-weight: bold;
        }

        h1 {
            font-size: 36px;
            color: #40536b;
        }

        .section-line {
            height: 3px;
            flex: 1;

            background: linear-gradient(
                90deg,
                #aee4f4,
                #f0cf67
            );

            border-radius: 10px;
        }

        .contact-box {
            background: rgba(255, 255, 255, 0.88);

            border: 2px solid #b9e7f5;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(117, 190, 220, 0.12);
        }

        .contact-box p {
            color: #718096;
            margin-bottom: 20px;
        }

        .contact-box a {
            color: #55aeca;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-box a:hover {
            color: #d3a62a;
            text-decoration: underline;
        }

        .contact-item {
            padding: 18px;

            margin-top: 15px;

            background: #fffdf3;

            border-radius: 12px;

            border-left: 5px solid #8ed8ed;
        }

        /* ปุ่มนำทางด้านล่าง */

        .page-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 35px;

            gap: 20px;
        }

        .page-navigation a {
            display: inline-block;

            padding: 12px 25px;

            background: #8ed8ed;

            color: white !important;

            text-decoration: none !important;

            border-radius: 8px;

            transition: 0.3s;
        }

        .page-navigation a:hover {
            background: #f0cf67;

            color: #40536b !important;

            transform: translateY(-3px);
        }

        footer {
            text-align: center;

            padding: 40px 20px;

            border-top: 1px solid #b9e7f5;

            color: #91a0ae;

            font-size: 13px;
        }

        @media (max-width: 600px) {

            .page-navigation {
                flex-direction: column;
                align-items: stretch;
            }

            .page-navigation a {
                text-align: center;
            }

        }

    </style>

</head>


<body>

    <nav>

        <div class="logo">
            Tanitta.
        </div>

        <div>

            <a href="index.html">

            </a>

        </div>

    </nav>


    <main class="container">

        <div class="section-title">

            <span class="section-number">

            </h1>

            <div class="section-line"></div>

        </div>


        <div class="contact-box">

            <p>
                หากต้องการติดต่อหรือพูดคุยเกี่ยวกับ Portfolio
                และผลงานต่าง ๆ สามารถติดต่อได้ทางช่องทางด้านล่างค่ะ
            </p>


            <div class="contact-item">

                <p>
                    📧 อีเมล
                </p>

                <a href="mailto:tanitta231251@email.com">
                    tanitta231251@email.com
                </a>

            </div>


            <div class="contact-item">

                <p>
                    📷 Instagram
                </p>

                <a
                    href="https://www.instagram.com/tanittttttttttt"
                    target="_blank"
                >
                    @tanittttttttttt
                </a>

            </div>


            <!-- ปุ่มไปหน้าก่อนหน้าและกลับ Home -->

            <div class="page-navigation">

                <a href="skills.html">
                    ← Skills
                </a>

                <a href="index.html">
                    🏠 กลับหน้า Home
                </a>

            </div>

        </div>

    </main>


    <footer>

        <p>
            Designed & Built by
            <strong>Tanitta</strong>
        </p>

        <p>
            © 2026 Tanitta
        </p>

    </footer>

</body>

</html>
