<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanitta | Home</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

            color: #40536b;

            background:

                radial-gradient(
                    circle at 10% 20%,
                    rgba(174, 228, 244, 0.45),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(240, 207, 103, 0.30),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #f8fbff,
                    #fffdf5
                );

            overflow-x: hidden;
        }



        /* =========================================
           MAIN CARD
        ========================================= */

        .card {

            width: 100%;

            max-width: 650px;

            background:
                rgba(255, 255, 255, 0.90);

            border:
                2px solid #b9e7f5;

            border-radius:
                30px;

            padding:
                55px 35px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(65, 145, 175, 0.15);

            position: relative;

            overflow: hidden;
        }



        /* =========================================
           DECORATION BACKGROUND
        ========================================= */

        .card::before {

            content: "";

            position: absolute;

            width: 220px;

            height: 220px;

            border-radius: 50%;

            background:
                rgba(167, 223, 240, 0.15);

            top: -110px;

            left: -110px;

            pointer-events: none;
        }


        .card::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            border-radius: 50%;

            background:
                rgba(240, 207, 103, 0.10);

            bottom: -90px;

            right: -90px;

            pointer-events: none;
        }



        /* =========================================
           PROFILE IMAGE WRAPPER
        ========================================= */

        .profile-wrap {

            width: 200px;

            height: 200px;

            aspect-ratio: 1 / 1;

            margin:
                0 auto 30px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-shrink: 0;
        }



        /* =========================================
           ROTATING DASHED CIRCLE
        ========================================= */

        .profile-wrap::before {

            content: "";

            position: absolute;

            width: 194px;

            height: 194px;

            aspect-ratio: 1 / 1;

            top: 3px;

            left: 3px;

            border:
                3px dashed #a7dff0;

            border-radius: 50%;

            box-sizing: border-box;

            animation:
                spin 15s linear infinite;
        }



        /* =========================================
           GLOW AROUND IMAGE
        ========================================= */

        .profile-wrap::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            aspect-ratio: 1 / 1;

            top: 10px;

            left: 10px;

            border-radius: 50%;

            background:
                rgba(155, 225, 245, 0.25);

            filter:
                blur(15px);

            animation:
                glow 3s ease-in-out infinite;
        }



        /* =========================================
           PROFILE IMAGE
        ========================================= */

        .profile {

            width: 175px;

            height: 175px;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 50%;

            border:
                5px solid white;

            box-sizing: border-box;

            position: relative;

            z-index: 2;

            display: block;

            /* รูปอยู่นิ่ง ไม่ขยับ */

            animation: none;

            box-shadow:
                0 10px 30px
                rgba(65, 145, 175, 0.25);
        }



        /* =========================================
           DECORATIVE HEARTS / STARS
        ========================================= */

        .deco {

            position: absolute;

            z-index: 4;

            pointer-events: none;

            user-select: none;
        }


        .heart-1 {

            top: 12px;

            left: 8px;

            font-size: 25px;

            animation:
                floatHeart 4s ease-in-out infinite;
        }


        .heart-2 {

            bottom: 10px;

            right: 5px;

            font-size: 20px;

            animation:
                floatHeart2 5s ease-in-out infinite;
        }


        .star-1 {

            top: 35px;

            right: 2px;

            font-size: 18px;

            animation:
                twinkle 2s ease-in-out infinite;
        }


        .star-2 {

            bottom: 30px;

            left: 0;

            font-size: 16px;

            animation:
                twinkle 2.5s ease-in-out infinite;
        }



        /* =========================================
           TEXT
        ========================================= */

        .welcome {

            color:
                #79bfd6;

            font-size:
                17px;

            font-weight:
                700;

            margin-bottom:
                8px;

            letter-spacing:
                0.5px;
        }


        h1 {

            color:
                #40536b;

            font-size:
                clamp(30px, 6vw, 46px);

            font-weight:
                800;

            line-height:
                1.35;

            margin-bottom:
                15px;
        }


        .name {

            color:
                #65b5cf;
        }


        .description {

            color:
                #718096;

            font-size:
                16px;

            line-height:
                1.8;

            margin-bottom:
                22px;
        }



        /* =========================================
           INTEREST BOX
        ========================================= */

        .interest-box {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            flex-wrap:
                wrap;

            gap:
                10px;

            margin:
                20px 0;
        }


        .interest {

            padding:
                8px 14px;

            background:
                #f4fbfd;

            border:
                1.5px solid #b9e7f5;

            border-radius:
                20px;

            color:
                #579ab1;

            font-size:
                13px;

            font-weight:
                700;
        }



        /* =========================================
           GOAL
        ========================================= */

        .goal {

            margin:
                25px auto;

            padding:
                14px 20px;

            max-width:
                450px;

            background:
                #fffaf0;

            border:
                2px solid #efd98a;

            border-radius:
                18px;

            color:
                #8b7540;

            font-weight:
                700;

            line-height:
                1.6;
        }



        /* =========================================
           PORTFOLIO BUTTON
        ========================================= */

        .portfolio-btn {

            display:
                inline-block;

            margin-top:
                10px;

            padding:
                14px 30px;

            background:
                #8ed8ed;

            border:
                2px solid #78cce3;

            border-radius:
                18px;

            color:
                white;

            text-decoration:
                none;

            font-size:
                16px;

            font-weight:
                800;

            box-shadow:
                0 8px 20px
                rgba(90, 170, 200, 0.20);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }


        .portfolio-btn:hover {

            transform:
                translateY(-4px);

            background:
                #75c9e1;

            box-shadow:
                0 13px 28px
                rgba(90, 170, 200, 0.28);
        }



        /* =========================================
           FOOTER
        ========================================= */

        footer {

            margin-top:
                30px;

            color:
                #9aa8b5;

            font-size:
                12px;

            line-height:
                1.7;
        }


        footer strong {

            color:
                #65abc1;
        }



        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes spin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }


        @keyframes glow {

            0%,
            100% {

                opacity:
                    0.45;

                transform:
                    scale(0.95);
            }

            50% {

                opacity:
                    0.85;

                transform:
                    scale(1.05);
            }

        }


        @keyframes floatHeart {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-8deg);

                opacity:
                    0.8;
            }

            50% {

                transform:
                    translateY(-10px)
                    rotate(8deg);

                opacity:
                    1;
            }

        }


        @keyframes floatHeart2 {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(8deg);

                opacity:
                    0.7;
            }

            50% {

                transform:
                    translateY(8px)
                    rotate(-8deg);

                opacity:
                    1;
            }

        }


        @keyframes twinkle {

            0%,
            100% {

                opacity:
                    0.35;

                transform:
                    scale(0.8);
            }

            50% {

                opacity:
                    1;

                transform:
                    scale(1.2);
            }

        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {

                padding:
                    20px;
            }


            .card {

                padding:
                    45px 22px;

                border-radius:
                    25px;
            }


            .profile-wrap {

                width:
                    190px;

                height:
                    190px;

                margin-bottom:
                    25px;
            }


            .profile-wrap::before {

                width:
                    184px;

                height:
                    184px;

                top:
                    3px;

                left:
                    3px;
            }


            .profile-wrap::after {

                width:
                    170px;

                height:
                    170px;

                top:
                    10px;

                left:
                    10px;
            }


            .profile {

                width:
                    165px;

                height:
                    165px;
            }


            h1 {

                font-size:
                    31px;
            }


            .description {

                font-size:
                    15px;
            }


            .interest {

                font-size:
                    12px;

                padding:
                    7px 11px;
            }


            .portfolio-btn {

                width:
                    100%;

                max-width:
                    300px;
            }

        }

    </style>

</head>



<body>


    <main class="card">


        <!-- =========================================
             PROFILE
        ========================================== -->

        <div class="profile-wrap">


            <span class="deco heart-1">
                💙
            </span>


            <span class="deco heart-2">
                💛
            </span>


            <span class="deco star-1">
                ✦
            </span>


            <span class="deco star-2">
                ✧
            </span>


            <img
                src="profile.jpg"
                alt="รูปโปรไฟล์ของ Tanitta"
                class="profile"
            >

        </div>



        <!-- =========================================
             INTRODUCTION
        ========================================== -->

        <div class="welcome">
            ยินดีต้อนรับสู่ Portfolio ของฉัน
        </div>


        <h1>
            สวัสดีค่ะ ฉันชื่อ
            <span class="name">
                ธนิษฐา
            </span>
        </h1>


        <p class="description">

            นักเรียนชั้นมัธยมศึกษาปีที่ 6
            <br>

            สายการเรียนเตรียมวิศวกรรมศาสตร์

        </p>



        <!-- =========================================
             INTERESTS
        ========================================== -->

        <div class="interest-box">

            <span class="interest">
                🧮 คณิตศาสตร์
            </span>

            <span class="interest">
                🧪 เคมี
            </span>

            <span class="interest">
                🔬 การทดลอง
            </span>

        </div>



        <!-- =========================================
             GOAL
        ========================================== -->

        <div class="goal">

            🎓 เป้าหมายในอนาคต:
            <strong>
                วิศวกรรมเคมี
            </strong>

        </div>



        <!-- =========================================
             PORTFOLIO BUTTON
        ========================================== -->

        <a
            href="portfolio.html"
            class="portfolio-btn"
        >
            📁 ดูแฟ้มสะสมงาน
        </a>



        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer>

            Portfolio ของ
            <strong>
                Tanitta
            </strong>

        </footer>


    </main>


</body>

</html>
