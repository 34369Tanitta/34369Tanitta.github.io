<!-- หน้าแรก -->

<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tanitta | Portfolio</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;

        background:
            radial-gradient(
                circle at top,
                #dff6ff 0%,
                #fff4c7 45%,
                #f8fbff 100%
            );

        color: #40536b;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px;
    }

    .card {
        width: 100%;
        max-width: 650px;

        background: rgba(255, 255, 255, 0.88);

        border: 2px solid #b9e7f5;
        border-radius: 24px;

        padding: 50px 35px;

        text-align: center;

        box-shadow:
            0 20px 60px
            rgba(117, 190, 220, 0.25);

        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);

        box-shadow:
            0 25px 70px
            rgba(117, 190, 220, 0.35);
    }

    .profile {
        width: 150px;
        height: 150px;

        object-fit: cover;
        border-radius: 50%;

        margin-bottom: 25px;

        border: 5px solid #aee4f4;

        box-shadow:
            0 0 0 6px #fff7d6,
            0 0 30px rgba(117, 190, 220, 0.3);

        transition: 0.3s;
    }

    .profile:hover {
        transform: scale(1.05);
    }

    h1 {
        font-size: 42px;
        margin-bottom: 15px;

        color: #40536b;
    }

    h1 span {
        color: #55aeca;

        text-shadow:
            0 0 15px rgba(85, 174, 202, 0.25);
    }

    .intro {
        color: #718096;
        font-size: 18px;
        line-height: 1.8;

        margin-bottom: 25px;
    }

    .interest {
        color: #5fa8c0;
        font-size: 17px;

        margin-bottom: 20px;
    }

    .goal {
        color: #d3a62a;
        font-size: 17px;
        font-weight: bold;

        margin-bottom: 30px;
    }

    .button {
        display: inline-block;

        background: #8ed8ed;
        color: #ffffff;

        padding: 13px 30px;

        text-decoration: none;
        border-radius: 12px;

        font-weight: bold;

        box-shadow:
            0 8px 25px
            rgba(117, 190, 220, 0.25);

        transition: 0.3s;
    }

    .button:hover {
        background: #f0cf67;

        color: #40536b;

        transform: translateY(-4px);

        box-shadow:
            0 12px 30px
            rgba(220, 190, 90, 0.3);
    }

    .small {
        margin-top: 25px;

        color: #91a0ae;
        font-size: 13px;
    }

</style>

</head>


<body>

    <div class="card">
<img
    src="profile.jpg"
    alt="รูปโปรไฟล์ของธนิษฐา"
    class="profile"
>
        
        <h1>
            สวัสดีค่ะ ฉันชื่อ
            <span>ธนิษฐา</span>
        </h1>

        <p class="intro">
            นักเรียนชั้นมัธยมศึกษาปีที่ 6
            สายการเรียนเตรียมวิศวกรรมศาสตร์
        </p>

        <p class="interest">
            📐 สนใจคณิตศาสตร์
            &nbsp;·&nbsp;
            🧪 สนใจเคมี
            &nbsp;·&nbsp;
            🔬 ชอบการทดลอง
        </p>
<p class="goal">
    🎓 เป้าหมายในอนาคต: วิศวกรรมเคมี
</p>
        <a
            href="portfolio.html"
            class="button"
        >
            📁 ดูแฟ้มสะสมงาน
        </a>

        <p class="small">
            Portfolio ของ Tanitta
        </p>

    </div>

</body>

</html>
