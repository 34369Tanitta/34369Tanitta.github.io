<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanitta | Home</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(185, 231, 245, 0.65),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(255, 231, 170, 0.5),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #f8fdff,
                    #eefaff
                );

            color: #28536b;
        }


        /* ================= CARD ================= */

        .card {
            width: 100%;
            max-width: 650px;

            padding: 50px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.88);

            border: 2px solid #b9e7f5;

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(72, 147, 177, 0.15);

            position: relative;
        }


        /* ================= PROFILE ================= */

        .profile-wrap {
            width: 200px;
            height: 200px;

            aspect-ratio: 1 / 1;

            margin: 0 auto 30px;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;
        }

        .profile-wrap::before {
            content: "";

            position: absolute;

            width: 194px;
            height: 194px;

            aspect-ratio: 1 / 1;

            top: 3px;
            left: 3px;

            border: 3px dashed #a7dff0;

            border-radius: 50%;

            box-sizing: border-box;

            animation: spin 15s linear infinite;
        }

        .profile-wrap::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            aspect-ratio: 1 / 1;

            top: 10px;
            left: 10px;

            border-radius: 50%;

            background: rgba(155, 225, 245, 0.25);

            filter: blur(15px);

            animation: glow 3s ease-in-out infinite;
        }

        .profile {
            width: 175px;
            height: 175px;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid white;

            box-sizing: border-box;

            position: relative;

            z-index: 2;

            display: block;

            animation: profileFloat 4s ease-in-out infinite;

            box-shadow:
                0 10px 30px rgba(65, 145, 175, 0.25);
        }


        /* ================= DECORATIONS ================= */

        .deco {
            position: absolute;

            z-index: 5;

            pointer-events: none;
        }

        .heart1 {
            top: 0;
            right: -5px;

            font-size: 1.5rem;

            animation: floatHeart 3s ease-in-out infinite;
        }

        .heart2 {
            bottom: 10px;
            left: -8px;

            font-size: 1.35rem;

            animation: floatHeart2 3.5s ease-in-out infinite;
        }

        .star1 {
            top: 35px;
            left: -15px;

            font-size: 1.3rem;

            animation: twinkle 2s ease-in-out infinite;
        }

        .star2 {
            bottom: 25px;
            right: -15px;

            font-size: 1.2rem;

            animation: twinkle 2.5s ease-in-out infinite;
        }


        /* ================= TEXT ================= */

        h1 {
            font-size: 2.6rem;

            color: #326f8c;

            margin-bottom: 12px;
        }

        .name {
            color: #397c9d;
        }

        .description {
            color: #648391;

            font-size: 1.05rem;

            line-height: 1.8;

            margin-bottom: 20px;
        }

        .interest {
            color: #597887;

            line-height: 1.8;

            margin-bottom: 25px;
        }

        .goal {
            display: inline-block;

            padding: 12px 20px;

            margin-bottom: 25px;

            background: rgba(255, 248, 225, 0.9);

            border: 2px solid #f4d98b;

            border-radius: 18px;

            color: #8a7137;

            font-weight: 700;
        }


        /* ================= BUTTON ================= */

        .portfolio-button {
            display: inline-block;

            padding: 15px 28px;

            background: rgba(255, 255, 255, 0.9);

            border: 2px solid #b9e7f5;

            border-radius: 18px;

            color: #397c9d;

            text-decoration: none;

            font-weight: 800;

            box-shadow:
                0 10px 25px rgba(75, 155, 185, 0.12);

            transition: 0.3s ease;
        }

        .portfolio-button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 30px rgba(75, 155, 185, 0.2);

            background: white;
        }


        /* ================= FOOTER ================= */

        footer {
            margin-top: 25px;

            color: #86aebb;

            font-size: 0.9rem;
        }


        /* ================= ANIMATIONS ================= */

        @keyframes profileFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }

        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes glow {

            0%, 100% {
                opacity: 0.5;
                transform: scale(0.95);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }

        }

        @keyframes floatHeart {

            0%, 100% {
                transform:
                    translateY(0)
                    rotate(-8deg);
            }

            50% {
                transform:
                    translateY(-10px)
                    rotate(8deg);
            }

        }

        @keyframes floatHeart2 {

            0%, 100% {
                transform:
                    translateY(0)
                    rotate(8deg);
            }

            50% {
                transform:
                    translateY(8px)
                    rotate(-8deg);
            }

        }

        @keyframes twinkle {

            0%, 100% {
                opacity: 0.4;
                transform: scale(0.85);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }

        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .card {
                padding: 40px 22px;
            }

            .profile-wrap {
                width: 190px;
                height: 190px;
            }

            .profile-wrap::before {
                width: 184px;
                height: 184px;

                top: 3px;
                left: 3px;
            }

            .profile-wrap::after {
                width: 170px;
                height: 170px;

                top: 10px;
                left: 10px;
            }

            .profile {
                width: 165px;
                height: 165px;
            }

            h1 {
                font-size: 2.2rem;
            }

        }

    </style>

</head>


<body>


    <div class="card">


        <!-- PROFILE -->

        <div class="profile-wrap">

            <img
                src="profile.jpg"
                alt="รูปโปรไฟล์ของ Tanitta"
                class="profile"
            >

            <span class="deco heart1">
                💙
            </span>

            <span class="deco heart2">
                💗
            </span>

            <span class="deco star1">
                ✨
            </span>

            <span class="deco star2">
                ⭐
            </span>

        </div>


        <!-- TEXT -->

        <h1>
            สวัสดีค่ะ ฉันชื่อ
            <span class="name">
                ธนิษฐา
            </span>
        </h1>


        <div class="description">

            นักเรียนชั้นมัธยมศึกษาปีที่ 6
            <br>
            สายการเรียนเตรียมวิศวกรรมศาสตร์

        </div>


        <div class="interest">

            สนใจด้านคณิตศาสตร์ เคมี
            และการทดลองทางวิทยาศาสตร์
            <br>
            ชอบการคิดวิเคราะห์และเรียนรู้จากการลงมือทำ

        </div>


        <div class="goal">

            🎓 เป้าหมายในอนาคต: วิศวกรรมเคมี

        </div>


        <br>


        <a
            href="portfolio.html"
            class="portfolio-button"
        >
            📁 ดูแฟ้มสะสมงาน
        </a>


        <footer>

            Portfolio ของ Tanitta

        </footer>


    </div>


</body>

</html>
